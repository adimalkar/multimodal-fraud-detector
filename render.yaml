services:
  - type: web
    name: multimodal-fraud-detector
    env: python
    buildCommand: "pip install -r requirements.txt && python database/init_db.py"
    startCommand: "bash -c '(while true; do sleep 600; curl -s https://multimodal-fraud-detector-1.onrender.com/ > /dev/null || true; done) & exec streamlit run app.py --server.port $PORT'"
