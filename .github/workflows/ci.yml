name: Python CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=github
        # The GitHub editor is 127 chars wide
        ruff check . --exit-zero --line-length=127 --output-format=github

    - name: Verify Application Imports
      run: |
        # Ensures that the main files can be parsed and imported without runtime syntax/import errors
        python -c "import app"
        python -c "from backend import qwen_agent"
        python -c "from backend import app"
