name: Python CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest httpx
        # Install system dependencies for OpenCV & PDF rendering
        sudo apt-get update && sudo apt-get install -y libgl1 poppler-utils ffmpeg

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=github
        # Style check report
        ruff check . --exit-zero --line-length=127 --output-format=github

    - name: Verify Core Imports
      run: |
        python -c "import app"
        python -c "from backend import qwen_agent"
        python -c "from backend import app"
        python -c "from backend import storage"

    - name: Run Automated Pytest Suite
      run: |
        pytest tests/ -v --durations=10

  frontend-ci:
    name: Frontend CI (Lint, TypeCheck & Next.js Build)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci || npm install

    - name: Check ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: TypeScript Type Check
      working-directory: ./frontend
      run: npm run type-check

    - name: Build Next.js Production Bundle
      working-directory: ./frontend
      run: npm run build

  docker-verification:
    name: Docker & Hugging Face Container Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Container Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: fraud-detection-engine:ci
