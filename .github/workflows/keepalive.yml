name: Ping Render App

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL (burst)
        run: |
          # Ping immediately
          curl -sf https://multimodal-fraud-detector-1.onrender.com/ > /dev/null || true
          # Wait 2 minutes and ping again to cover GitHub cron drift
          sleep 120
          curl -sf https://multimodal-fraud-detector-1.onrender.com/ > /dev/null || true
